spring:
  application:
    name: l3_manager_employee

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/l3_manager_employee}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8082}

Ocean:
  jwt:
    secretKey: ${Ocean_JWT_SECRET_KEY:ThisIsAVeryLongSecretKeyForHS256JwtSigning123456}
    access-token-expiration: ${Ocean_JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${Ocean_JWT_REFRESH_EXPIRATION:604800000}